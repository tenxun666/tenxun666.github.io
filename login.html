<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <!-- Minimal header for utility page -->
        <!-- The main page title (Login) will be inside auth-container -->
    </header>

    <main>
        <div class="auth-container">
            <h2>Login</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="login-email">Email:</label>
                    <input type="email" id="login-email" name="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Password:</label>
                    <input type="password" id="login-password" name="password" placeholder="Enter your password" required>
                </div>
                <button type="submit">Login</button>
            </form>
            <p class="form-link">Don't have an account? <a href="register.html">Register here</a>.</p>
        </div>
    </main>

    <footer>
        <!-- Minimal footer for utility page -->
        <p>&copy; 2023 E-commerce Store</p>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
