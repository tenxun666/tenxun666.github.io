<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - E-Commerce Site</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>My E-Commerce Site</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="cart.html">Cart</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="register.html">Register</a></li>
            </ul>
        </nav>
        <form id="search-form">
            <input type="search" id="search-input" placeholder="Search products...">
            <button type="submit">Search</button>
        </form>
    </header>

    <main>
        <h2>Your Shopping Cart</h2>
        <section id="cart-items-container">
            <!-- Placeholder for cart items table/list -->
            <p>Your cart items will appear here.</p>
            <!-- Example item structure:
            <div class="cart-item">
                <img src="images/placeholder.png" alt="Product Image" width="50">
                <span>Product Name</span>
                <span>Price</span>
                <input type="number" value="1" min="1">
                <span>Subtotal</span>
                <button class="remove-item-btn">Remove</button>
            </div>
            -->
        </section>
        <section id="cart-summary">
            <h3>Cart Summary</h3>
            <p>Total: <span id="cart-total">$0.00</span></p>
            <a href="checkout.html"><button id="proceed-to-checkout-btn">Proceed to Checkout</button></a>
        </section>
    </main>

    <footer>
        <p>&copy; 2023 My E-Commerce Site</p>
        <nav>
            <ul>
                <li><a href="#">Contact Us</a></li>
                <li><a href="#">Terms of Service</a></li>
                <li><a href="#">Privacy Policy</a></li>
            </ul>
        </nav>
        <div>
            <p>Social Media</p>
        </div>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/cart.js"></script> <!-- Specific script for cart functionality -->
</body>
</html>
