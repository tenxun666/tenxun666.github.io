<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results - E-Commerce Site</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>My E-Commerce Site</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="cart.html">Cart</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="register.html">Register</a></li>
            </ul>
        </nav>
        <form id="search-form-header">
            <input type="search" id="search-input-header" placeholder="Search products...">
            <button type="submit">Search</button>
        </form>
    </header>

    <main>
        <h2>Search Results for "<span id="search-term-display">your query</span>"</h2>
        <section id="search-results-container">
            <!-- Placeholder for product items, similar to products.html -->
            <p>Matching products will be listed here.</p>
            <!-- Example item structure:
            <div class="product-item">
                <img src="images/placeholder.png" alt="Product Image" width="100">
                <h3>Product Name</h3>
                <p>Price: $XX.XX</p>
                <a href="product-detail.html?id=XYZ">View Details</a>
            </div>
            -->
        </section>
        <p id="no-results-message" style="display:none;">No products found matching your search.</p>
    </main>

    <footer>
        <p>&copy; 2023 My E-Commerce Site</p>
        <nav>
            <ul>
                <li><a href="#">Contact Us</a></li>
                <li><a href="#">Terms of Service</a></li>
                <li><a href="#">Privacy Policy</a></li>
            </ul>
        </nav>
        <div>
            <p>Social Media</p>
        </div>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
