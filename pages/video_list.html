<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频列表 - 视频网站</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <div class="logo">
            <h1><a href="../index.html">视频网站</a></h1>
        </div>
        <nav>
            <ul>
                <li><a href="../index.html">首页</a></li>
                <li><a href="video_list.html?category=movie">电影</a></li>
                <li><a href="video_list.html?category=series">电视剧</a></li>
                <li><a href="video_list.html?category=anime">动漫</a></li>
            </ul>
        </nav>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="搜索视频...">
            <button id="searchButton">搜索</button>
        </div>
        <div class="user-actions">
            <a href="login.html" id="loginLink">登录</a>
            <a href="register.html" id="registerLink">注册</a>
            <a href="profile.html" id="profileLink" style="display:none;">个人中心</a>
            <a href="#" id="logoutLink" style="display:none;">退出</a>
        </div>
    </header>

    <main>
        <section class="video-list-container">
            <h2 id="listTitle">所有视频</h2> <!-- Title will be updated by JS based on category -->
            <div class="video-grid" id="videoListGrid">
                <!-- Placeholder video items - these will be dynamically populated by JS -->
                <div class="video-item">
                    <a href="player.html?id=placeholder1">
                        <img src="../images/placeholder_thumbnail.png" alt="视频标题Placeholder 1">
                        <h3>视频标题Placeholder 1</h3>
                        <p>这是一个视频的简短描述...</p>
                    </a>
                </div>
                <div class="video-item">
                    <a href="player.html?id=placeholder2">
                        <img src="../images/placeholder_thumbnail.png" alt="视频标题Placeholder 2">
                        <h3>视频标题Placeholder 2</h3>
                        <p>这是另一个视频的简短描述...</p>
                    </a>
                </div>
                <div class="video-item">
                    <a href="player.html?id=placeholder3">
                        <img src="../images/placeholder_thumbnail.png" alt="视频标题Placeholder 3">
                        <h3>视频标题Placeholder 3</h3>
                        <p>更多视频描述信息在这里...</p>
                    </a>
                </div>
                <div class="video-item">
                    <a href="player.html?id=placeholder4">
                        <img src="../images/placeholder_thumbnail.png" alt="视频标题Placeholder 4">
                        <h3>视频标题Placeholder 4</h3>
                        <p>视频的精彩内容简介...</p>
                    </a>
                </div>
                <!-- More items can be added or will be generated by JS -->
            </div>
            <p id="noVideosMessage" style="display:none; text-align:center; margin-top: 2rem;">该分类下暂无视频。</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2023 视频网站. 保留所有权利.</p>
        <ul>
            <li><a href="about.html">关于我们</a></li>
            <li><a href="contact.html">联系我们</a></li>
            <li><a href="faq.html">FAQ</a></li>
        </ul>
    </footer>

    <script src="../js/data.js"></script> <!-- Include mock data -->
    <script src="../js/main.js"></script>
    <!-- We might create a dedicated js/video_list.js later if logic becomes complex -->
</body>
</html>
