<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <!-- Minimal header for utility page -->
        <!-- The main page title (Create Account) will be inside auth-container -->
    </header>

    <main>
        <div class="auth-container">
            <h2>Create Account</h2>
            <form id="register-form">
                <div class="form-group">
                    <label for="register-username">Username:</label>
                    <input type="text" id="register-username" name="username" placeholder="Choose a username" required>
                </div>
                <div class="form-group">
                    <label for="register-email">Email:</label>
                    <input type="email" id="register-email" name="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="register-password">Password:</label>
                    <input type="password" id="register-password" name="password" placeholder="Create a password" required>
                </div>
                <div class="form-group">
                    <label for="register-confirm-password">Confirm Password:</label>
                    <input type="password" id="register-confirm-password" name="confirm-password" placeholder="Confirm your password" required>
                </div>
                <button type="submit">Register</button>
            </form>
            <p class="form-link">Already have an account? <a href="login.html">Login here</a>.</p>
        </div>
    </main>

    <footer>
        <!-- Minimal footer for utility page -->
        <p>&copy; 2023 E-commerce Store</p>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
